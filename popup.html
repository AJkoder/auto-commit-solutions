<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 280px; padding: 12px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    h3 { margin-top: 0; color: #333; }
    input, button { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
    button { background-color: #2ea44f; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #2c974b; }
    #status { color: #2ea44f; font-weight: bold; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <h3>Git Sync Settings</h3>
  <input type="password" id="token" placeholder="GitHub Personal Access Token">
  <input type="text" id="repo" placeholder="github-username/repo-name">
  <button id="save">Save Credentials</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
